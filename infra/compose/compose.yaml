# Data services on the VPS: hot path (ingest, lake-writer), Dagster and Postgres. Settings come from .env (see .env.example);
# locally, run compose.local.yaml (docs/deploy.md#data-services).
name: scintille-data

x-service: &service
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  logging:
    driver: ${SCINTILLE_LOG_DRIVER:-json-file}

x-pipelines: &pipelines
  <<: *service
  image: ghcr.io/pierregc/scintille-pipelines:${SCINTILLE_TAG:-main}
  build:
    context: ../../data
    dockerfile: Dockerfile
    args:
      PACKAGE: scintille-pipelines
  environment:
    SCINTILLE_POSTGRES_DSN: postgresql://scintille:${POSTGRES_PASSWORD:-scintille}@postgres:5432/scintille
    SCINTILLE_CACHE_DIR: /var/lib/scintille/cache
  # Reference downloads (Natural Earth) survive container recreation.
  volumes:
    - cache:/var/lib/scintille/cache
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    <<: *service
    image: mirror.gcr.io/library/postgres:17
    environment:
      POSTGRES_USER: scintille
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scintille}
      POSTGRES_DB: scintille
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scintille -d scintille"]
      interval: 5s
      retries: 10

  dagster-webserver:
    <<: *pipelines
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "scintille_pipelines.definitions"]
    # Loopback only: reach it through an SSH tunnel, never publicly.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=5)"]
      interval: 10s
      start_period: 30s
      retries: 6

  dagster-daemon:
    <<: *pipelines
    command: ["dagster-daemon", "run", "-m", "scintille_pipelines.definitions"]
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      start_period: 60s
      retries: 3

  ingest:
    <<: *service
    image: ghcr.io/pierregc/scintille-ingest:${SCINTILLE_TAG:-main}
    build:
      context: ../../data
      dockerfile: Dockerfile
      args:
        PACKAGE: scintille-ingest
    command: ["scintille-ingest", "live", "--spool", "/var/lib/scintille/spool", "--port", "8080"]
    environment:
      SCINTILLE_POSTGRES_DSN: postgresql://scintille:${POSTGRES_PASSWORD:-scintille}@postgres:5432/scintille
    volumes:
      - spool:/var/lib/scintille/spool
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 15s
      start_period: 20s
      retries: 4
    depends_on:
      postgres:
        condition: service_healthy

  # Separate from ingest so that the lakehouse can never slow down or stop the live feed.
  lake-writer:
    <<: *service
    image: ghcr.io/pierregc/scintille-ingest:${SCINTILLE_TAG:-main}
    command: ["scintille-ingest", "lake-writer", "--spool", "/var/lib/scintille/spool"]
    environment:
      SCINTILLE_POSTGRES_DSN: postgresql://scintille:${POSTGRES_PASSWORD:-scintille}@postgres:5432/scintille
    volumes:
      - spool:/var/lib/scintille/spool
    depends_on:
      postgres:
        condition: service_healthy

  # Reads the public manifest through Cloudflare and reports to Healthchecks.io (docs/operations.md).
  live-probe:
    <<: *service
    image: ghcr.io/pierregc/scintille-ingest:${SCINTILLE_TAG:-main}
    command: ["scintille-ingest", "live-probe"]

volumes:
  postgres:
  spool:
  cache:
