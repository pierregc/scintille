name: data

on:
  pull_request:
    paths: ["data/**", "fixtures/**", "web/src/contract/**", "docs/data-contract.md", ".github/workflows/data.yml"]
  push:
    branches: [main]
    paths: ["data/**", "fixtures/**", "web/src/contract/**", "docs/data-contract.md", ".github/workflows/data.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: data/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Contract is generated and versioned
        run: uv run scintille-contract check --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: uv run pytest
