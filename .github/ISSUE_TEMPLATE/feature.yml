name: Feature
description: A new capability, specified enough to be delivered in one PR.
labels: [feature]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and how it fits the project.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable checks that define done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Files or folders expected to change.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this ticket does not cover.
