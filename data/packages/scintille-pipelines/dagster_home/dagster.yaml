# Dagster instance: run, event and schedule storage in Postgres.
# The URL names psycopg2: dagster-postgres binds NOTIFY parameters client side, which psycopg 3,
# the SQLAlchemy 2.1 default for postgresql://, rejects.
storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

concurrency:
  runs:
    max_concurrent_runs: 2
  # Backfills download from NOAA: the queue starts one run of the `noaa` pool at a time.
  pools:
    granularity: run
    default_limit: 1

# Run monitoring fails a run whose worker died, a deploy included (ADR 0024); run retries relaunch
# it. Step failures are not retried here: assets retry their own steps.
run_launcher:
  module: scintille_pipelines.run_launcher
  class: MonitoredRunLauncher

run_monitoring:
  enabled: true
  start_timeout_seconds: 600
  max_runtime_seconds: 21600
  poll_interval_seconds: 60

run_retries:
  enabled: true
  max_retries: 2
  retry_on_asset_or_op_failure: false

telemetry:
  enabled: false
