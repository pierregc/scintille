# Dagster instance: run, event and schedule storage in Postgres.
storage:
  postgres:
    postgres_url:
      env: SCINTILLE_POSTGRES_DSN

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2
    # Backfills download from NOAA: one partition at a time.
    tag_concurrency_limits:
      - key: scintille/backfill
        limit: 1

telemetry:
  enabled: false
