[project]
name = "scintille-pipelines"
version = "0.1.0"
description = "Batch pipelines orchestrated by Dagster."
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13",
    "dagster-postgres>=0.29",
    "dagster-webserver>=1.13",
    "duckdb>=1.5",
    "obstore>=0.11.1",
    "polars>=2.0.0",
    "psycopg[binary]>=3.2",
    "scintille-contract",
    "scipy>=1.16",
    "scintille-ingest",
    "scintille-lake",
    "shapely>=2.1",
]

[project.scripts]
scintille-active-storms = "scintille_pipelines.active_service:main"
scintille-storm-search = "scintille_pipelines.storm_search:main"

[tool.uv.sources]
scintille-contract = { workspace = true }
scintille-ingest = { workspace = true }
scintille-lake = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scintille_pipelines"
