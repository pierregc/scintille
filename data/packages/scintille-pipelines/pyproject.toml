[project]
name = "scintille-pipelines"
version = "0.1.0"
description = "Batch pipelines orchestrated by Dagster."
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13",
    "dagster-postgres>=0.29",
    "dagster-webserver>=1.13",
    "obstore>=0.11.1",
    "psycopg[binary]>=3.2",
    "scintille-lake",
]

[tool.uv.sources]
scintille-lake = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scintille_pipelines"
