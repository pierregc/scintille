[project]
name = "scintille-lake"
version = "0.1.0"
description = "Iceberg lakehouse: catalog connection, namespaces and tables as code."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=26",
    "psycopg[binary]>=3.2",
    "pyiceberg[pyarrow,pyiceberg-core]>=0.12",
]

[project.scripts]
scintille-lake = "scintille_lake.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scintille_lake"
