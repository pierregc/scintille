[project]
name = "scintille-contract"
version = "0.1.0"
description = "Shared data contract: flash schema and live feed format."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3",
    "pydantic>=2.12",
    "shapely>=2.1",
]

[project.scripts]
scintille-contract = "scintille_contract.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scintille_contract"
