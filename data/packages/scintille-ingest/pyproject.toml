[project]
name = "scintille-ingest"
version = "0.1.0"
description = "Hot path service: satellite ingestion and live feed publishing."
requires-python = ">=3.13"
dependencies = [
    "eccodes>=2.49",
    "eccodeslib>=2.49 ; sys_platform != 'win32'",
    "eumdac>=3.1",
    "netcdf4>=1.7.4",
    "obstore>=0.11.1",
    "pandera[polars]>=0.34",
    "pillow>=11",
    "polars>=2.0.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "scintille-contract",
    "scintille-lake",
]

[project.scripts]
scintille-ingest = "scintille_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scintille_ingest"

[tool.uv.sources]
scintille-contract = { workspace = true }
scintille-lake = { workspace = true }
