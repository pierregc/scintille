# Virtual uv workspace: no package lives at this level, only shared tooling.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "brotli>=1.1",
    "dagster-webserver>=1.13",
    "mypy>=1.18",
    "pyarrow-stubs>=20",
    "pytest>=8.4",
    "ruff>=0.14",
    "sqlalchemy>=2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["packages/*/src", "packages/*/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = ["--import-mode=importlib", "-m", "not network and not lake"]
markers = [
    "network: needs internet access to the NOAA buckets (run with -m network)",
    "lake: needs the local lakehouse from compose.yaml (run with -m lake)",
]
